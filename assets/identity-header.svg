<defs>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040a0c"/><stop offset=".52" stop-color="#061419"/><stop offset="1" stop-color="#020609"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#d3fff1"/><stop offset=".33" stop-color="#45ffc6"/><stop offset=".68" stop-color="#28e2d7"/><stop offset="1" stop-color="#57bfff"/></linearGradient>
