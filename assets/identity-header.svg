  <radialGradient id="aura"><stop stop-color="#12ffb3" stop-opacity=".27"/><stop offset="1" stop-color="#12ffb3" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.1"/></filter>
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="1" fill="#b3fff1" opacity=".029"/></pattern>
  <style>
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    .pulse{animation:dim 4s ease-in-out infinite}
    .scan{animation:sweep 8s linear infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes dim{0%,100%{opacity:.48}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateY(-260px)}100%{transform:translateY(540px)}}
  </style>
</defs>
