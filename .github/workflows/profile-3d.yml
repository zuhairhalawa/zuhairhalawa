name: Update 3D Contribution Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: profile-3d-calendar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Generate 3D contribution images
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: zuhairhalawa

      - name: Check generated images
        run: |
          test -s profile-3d-contrib/profile-night-rainbow.svg
          test -s profile-3d-contrib/profile-green.svg

      - name: Save generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "Images are already up to date."
          else
            git commit -m "Update 3D contribution calendar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
